name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: |
          {
            echo "=== mcp-publisher version ==="
            ./mcp-publisher --version || true
            echo "=== login output ==="
            ./mcp-publisher login github-oidc
          } > ci-debug-log.txt 2>&1
        continue-on-error: true

      - name: Publish to MCP Registry
        run: |
          {
            echo "=== publish output ==="
            ./mcp-publisher publish ./server.json
            echo "=== exit code: $? ==="
          } >> ci-debug-log.txt 2>&1
        continue-on-error: true

      - name: Commit debug log
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug-bot@users.noreply.github.com"
          git checkout -B ci-debug
          git add ci-debug-log.txt
          git commit -m "ci: debug log for MCP Registry publish attempt" || echo "nothing to commit"
          git push --force origin ci-debug
